name: Release

# Releases one utility: Actions → Release → Run workflow, or
#   gh workflow run release.yml -f utility=Calipers -f bump=patch
# It builds main's HEAD, signs it with the Developer ID, notarizes it and
# publishes a GitHub Release tagged <id>-vX.Y.Z with <Name>.dmg (to install)
# and <Name>.zip (what installed apps download to update).

on:
  workflow_dispatch:
    inputs:
      utility:
        description: Utility to release (its folder in Utilities/, e.g. Calipers)
        required: true
        type: string
      bump:
        description: Version bump from its latest release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Exact version instead (e.g. 1.0.0); overrides bump
        required: false
        type: string

concurrency:
  group: release-${{ inputs.utility }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.utility }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Only from the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Release from ${{ github.event.repository.default_branch }}, not ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version
        env:
          UTILITY: ${{ inputs.utility }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ -f "Utilities/$UTILITY/Info.plist" ]] || { echo "::error::No utility at Utilities/$UTILITY"; exit 1; }
          scripts/next-version.sh "$UTILITY" "$BUMP" "$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        env:
          UTILITY: ${{ inputs.utility }}
          VERSION: ${{ steps.meta.outputs.version }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          scripts/build-app.sh "$UTILITY" --release "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          UTILITY: ${{ inputs.utility }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$UTILITY $VERSION" --generate-notes --latest=false)
          if [[ -n "$PREVIOUS_TAG" ]]; then args+=(--notes-start-tag "$PREVIOUS_TAG"); fi
          gh release create "$TAG" "build/$UTILITY.dmg" "build/$UTILITY.zip" "${args[@]}"
