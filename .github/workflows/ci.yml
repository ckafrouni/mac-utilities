name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build every utility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -euo pipefail
          swift --version
          for dir in Utilities/*/; do
            scripts/build-app.sh "$(basename "$dir")"
          done
